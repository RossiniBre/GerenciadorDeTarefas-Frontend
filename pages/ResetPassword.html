<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNexus - Redefinir senha</title>
    <link rel="icon" type="image/x-icon" href="../assets/Favicon.ico">
    <link rel="stylesheet" href="/css/loginScreen.css">
    <link rel="stylesheet" href="/css/ResetPasswordStyles/resetPassword.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container page-transition">

        <header class="header-logo">
            <h1 class="title">TaskNexus</h1>
        </header>

        <form class="form-login">

            <div class="">
                <input type="text" placeholder="Código de recuperação" class="user-field" id="token-input">
            </div>

            <div class="password-wrapper">
                <input type="password" placeholder="Nova senha" class="password-field" id="new-password-input" autocomplete="new-password">
                <button type="button" class="toggle-password" aria-label="Mostrar senha">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" class="icon-eye-open">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" class="icon-eye-closed hidden">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                        <path d="M10.73 5.08A11 11 0 0 1 12 5c7 0 11 8 11 8a18.5 18.5 0 0 1-2.34 3.5"/>
                        <path d="M6.61 6.61A18.5 18.5 0 0 0 1 13s4 8 11 8a10.6 10.6 0 0 0 5.39-1.61"/>
                        <path d="M1 1l22 22"/>
                    </svg>
                </button>
            </div>

            <div class="password-wrapper">
                <input type="password" placeholder="Confirme a nova senha" class="password-field" id="confirm-password-input" autocomplete="new-password">
                <button type="button" class="toggle-password" aria-label="Mostrar senha">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" class="icon-eye-open">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" class="icon-eye-closed hidden">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                        <path d="M10.73 5.08A11 11 0 0 1 12 5c7 0 11 8 11 8a18.5 18.5 0 0 1-2.34 3.5"/>
                        <path d="M6.61 6.61A18.5 18.5 0 0 0 1 13s4 8 11 8a10.6 10.6 0 0 0 5.39-1.61"/>
                        <path d="M1 1l22 22"/>
                    </svg>
                </button>
            </div>

            <button class="login-button active" type="submit">REDEFINIR SENHA</button>

            <div id="status-message"></div>

           <a href="../InitialScreen.html" class="back-to-login">Voltar</a>

        </form>

    </main>

    <script src="/js/utils/transition.js"></script>
    <script src="/js/resetPassword.js"></script>

</body>
</html>
