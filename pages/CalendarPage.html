<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/Favicon.ico">
    <link rel="stylesheet" href="/css/HomePageStyles/theme.css">
    <link rel="stylesheet" href="/css/HomePageStyles/base.css">
    <link rel="stylesheet" href="/css/HomePageStyles/homePageMain.css">
    <link rel="stylesheet" href="/css/HomePageStyles/sidebar.css">
    <link rel="stylesheet" href="/css/CalendarPageStyles/calendarPage.css">
    <link rel="stylesheet" href="/css/CalendarPageStyles/light-Mode.css">
    <script>
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "light") {
            document.documentElement.dataset.theme = "light";
        }
    </script>
    <title>TaskNexus - Calendário</title>
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="container page-transition">

        <header id="month-infos"> 
            
            <h1><span id="month">Mês</span> | <span id="year">Ano</span></h1>
            
            <div class="header-actions">
                <button id="prev-month" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button id="next-month" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>

        </header>

        <div id="week-days">
            <div class="week-day">DOM</div>
            <div class="week-day">SEG</div>
            <div class="week-day">TER</div>
            <div class="week-day">QUA</div>
            <div class="week-day">QUI</div>
            <div class="week-day">SEX</div>
            <div class="week-day">SÁB</div>
        </div>

        <div id="calendar-grid"></div>
    
</main>

    <div id="task-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <button id="modal-close" type="button" class="modal-close">&times;</button>
            <h2 id="modal-date"></h2>
            <div id="modal-tasks-list"></div>
        </div>
    </div>
        
    <script src="/js/utils/transition.js"></script>
    <script src="/js/utils/components.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/utils/tasks.js"></script>
    <script src="/js/calendarPage.js"></script>

</body>
</html>
