<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/x-icon" href="../assets/Favicon.ico">
    <link rel="stylesheet" href="/css/HomePageStyles/homePageMain.css">
    <link rel="stylesheet" href="/css/HomePageStyles/sidebar.css">
    <link rel="stylesheet" href="/css/NexusIAStyles/nexusIA.css">
    <link rel="stylesheet" href="/css/NexusIAStyles/light-mode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "light") {
            document.documentElement.dataset.theme = "light";
        }
    </script>
    <title>TaskNexus - Nexus IA</title>
</head>
<body>

    <div id="sidebar-container"></div>

    <div id="confirm-modal-overlay" class="hidden">
        <div id="confirm-modal-box">
            <p id="confirm-modal-text">Tem certeza que quer limpar toda a conversa?</p>
            <div id="confirm-modal-actions">
                <button type="button" id="confirm-modal-cancel">Cancelar</button>
                <button type="button" id="confirm-modal-ok">Limpar</button>
            </div>
        </div>
    </div>

    <main class="container page-transition">

        <p id="nexus-label">
            Nexus IA <span class="dot-separator">•</span>
            <img src="/assets/Favicon.ico" alt="" id="nexus-mini-icon">
        </p>

        <button type="button" id="clear-chat-btn" title="Limpar conversa">Limpar conversa</button>

        <div id="nexus-ia-wrapper">

            <header id="greeting">
                <h2>Olá <span id="user-name">Usuário</span>, Como posso te ajudar?</h2>
            </header>

            <div id="chat-messages"></div>

            <div id="message-tool">
                <input type="text" id="message-to-IA" placeholder="Digite algo...">
                <button type="button" id="submit-to-IA">Enviar</button>
            </div>

            <div id="suggestions-buttons">
                <div class="suggestion-item">
                    <button type="button">O que tenho para hoje?</button>
                </div>
                <div class="suggestion-item">
                    <button type="button">O que devo priorizar?</button>
                </div>
                <div class="suggestion-item">
                    <button type="button">Tenho tarefas atrasadas?</button>
                </div>
                <div class="suggestion-item">
                    <button type="button">Organize meu dia</button>
                </div>
                <div class="suggestion-item">
                    <button type="button">Como está minha semana?</button>
                </div>
            </div>

        </div>

    </main>

    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/utils/transition.js"></script>
    <script src="/js/utils/tasks.js"></script>
    <script src="/js/utils/components.js"></script>
    <script src="/js/nexusIA.js"></script>
</body>
</html>
