<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="/css/HomePageStyles/homePageMain.css">
    <link rel="stylesheet" href="/css/HomePageStyles/sidebar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNexus - Inicio</title>
</head>

<script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") {
        document.documentElement.dataset.theme = "light";
    }
</script>
<body>

     <div id="sidebar-container"></div>

    <main class="container page-transition">
        <header id="greeting"> 
            
            <h1>Bem-vindo de volta, <span id="user-name">username</span>!</h1>

       <div class="header-actions">
            <button id="create-task" type="button">Criar Tarefa</button>

            <button id="theme-toggle" type="button" aria-label="Alternar tema">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
                </svg>
            </button>
        </div>
        
        </header>

        <div id="task-filters">

            <div id="task-toolbar">

                <form class="task-search">

                    <div class="task-search-wrapper">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>

                        <input type="search" id="task-search" placeholder="Pesquisar tarefas..." autocomplete="off">

                        <button class="clear-search" aria-label="Limpar pesquisa" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-x-icon lucide-circle-x"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
                        </button>

                    </div>

                </form>

                <button id="task-button-filter" type="button">Filtrar Tarefas</button>

            </div>

            <div id="active-filters"></div>

        </div>

        
        
        <div id="tasks-container"></div>

        <div id="toast" class="toast"></div>

    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Criar tarefa</h3>
                <button type="button" id="task-modal-close" class="modal-close" aria-label="Fechar">&times;</button>
            </div>

            <form id="task-form">
                <label>
                    Título
                    <input
                        type="text"
                        id="task-title"
                        required
                        placeholder="Ex.: Limpar a casa"
                    >
                </label>

                <label>
                    Descrição 
                    <textarea
                        id="task-description"
                        rows="4"
                        placeholder="Adicione mais detalhes"
                    ></textarea>
                </label>

                <div class="form-row">
                    <label>
                        Data
                        <input type="date" id="task-date" required>
                    </label>

                    <label>
                        Horário
                        <input type="time" id="task-time" required>
                    </label>

                    <label>
                        Prioridade
                        <select id="task-priority" required>
                            <option value="LOW">Baixa</option>
                            <option value="MEDIUM">Média</option>
                            <option value="HIGH">Alta</option>
                        </select>
                    </label>
                </div>

                <label>
                    Categoria
                    <select id="task-category">
                        <option value="">Sem categoria</option>
                        <option value="STUDY">Estudo</option>
                        <option value="WORK">Trabalho</option>
                        <option value="PERSONAL">Pessoal</option>
                    </select>
                </label>

                <div class="modal-actions">
                    <button type="button" id="task-btn-cancel" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-submit">Criar</button>
                </div>

                <div id="task-form-error" class="task-form-error hidden">
                    Preencha todos os campos obrigatórios.
                </div>
            </form>
        </div>
    </div>

    <div id="task-details-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalhes da tarefa</h3>
                <button type="button" class="modal-close" aria-label="Fechar">&times;</button>
            </div>

            <form id="task-details-form">
                <label>
                    Título
                    <input type="text" id="details-title" required>
                </label>

                <label>
                    Descrição
                    <textarea id="details-description" rows="4" placeholder="Adicione mais detalhes"></textarea>
                </label>

                <div class="form-row">
                    <label>
                        Data
                        <input type="date" id="details-date" required>
                    </label>

                    <label>
                        Horário
                        <input type="time" id="details-time" required>
                    </label>

                    <label>
                        Prioridade
                        <select id="details-priority" required>
                            <option value="LOW">Baixa</option>
                            <option value="MEDIUM">Média</option>
                            <option value="HIGH">Alta</option>
                        </select>
                    </label>
                </div>

                <label>
                    Categoria
                    <select id="details-category">
                        <option value="">Sem categoria</option>
                        <option value="STUDY">Estudo</option>
                        <option value="WORK">Trabalho</option>
                        <option value="PERSONAL">Pessoal</option>
                    </select>
                </label>

                <div class="modal-actions details-actions">
                    <button type="button" id="details-btn-delete" class="btn-delete">Excluir</button>
                    <button type="button" id="details-btn-status" class="btn-status hidden"></button>
                    <button type="submit" class="btn-submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirm-delete-modal" class="modal hidden">
        <div class="modal-content confirm-modal-content">
            <h3>Excluir tarefa</h3>
            <p>Tem certeza que deseja excluir essa tarefa? Essa ação não pode ser desfeita.</p>

            <div class="modal-actions">
                <button type="button" id="confirm-delete-cancel" class="btn-cancel">Cancelar</button>
                <button type="button" id="confirm-delete-ok" class="btn-delete">Excluir</button>
            </div>
        </div>
    </div>

    <div id="filter-modal" class="modal hidden">
        <div class="filter-modal-content">

            <div class="filter-modal-header">
                <h3>Filtrar tarefa</h3>
                <button type="button" id="task-modal-close" class="filter-modal-close" aria-label="Fechar">&times;</button>
            </div>

            <form id="filter-task-form">

                    <fieldset>
                        <legend>Prioridade</legend>

                        <label>
                            <input type="checkbox" name="priority" value="HIGH"> Alta
                        </label>
                        <label>
                            <input type="checkbox" name="priority" value="MEDIUM"> Média
                        </label>
                        <label>
                            <input type="checkbox" name="priority" value="LOW"> Baixa
                        </label>
                    </fieldset>
                    
                     <fieldset>

                        <legend>Categoria</legend>

                            <label>
                                <input type="checkbox" name="category" value="STUDY">Estudo
                            </label>
                            <label>
                                <input type="checkbox" name="category" value="WORK">Trabalho
                            </label>
                            <label>
                                <input type="checkbox" name="category" value="PERSONAL">Pessoal
                            </label>
                            <label>
                                <input type="checkbox" name="category" value="UNCATEGORIZED">Sem categoria
                            </label>

                    </fieldset>

                    <fieldset>

                        <legend>Status</legend>

                            <label>
                                <input type="checkbox" name="status" value="PENDING">Pendente
                            </label>
                            <label>
                                <input type="checkbox" name="status" value="IN_PROGRESS">Em andamento
                            </label>
                            <label>
                                <input type="checkbox" name="status" value="COMPLETED">Completa
                            </label>

                    </fieldset>

                 <div class="filter-modal-actions">
                    <button type="button" id="filter-btn-cancel" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-submit">Aplicar</button>
                </div>
            </form>
        </div>
    </div>

    </main>
    
    <script src="/js/utils/transition.js"></script>
    <script src="/js/homePage.js"></script>
    <script src="/js/utils/components.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    
</body>
</html>
