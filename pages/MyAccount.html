<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/HomePageStyles/theme.css">
    <link rel="stylesheet" href="/css/HomePageStyles/base.css">
    <link rel="stylesheet" href="/css/HomePageStyles/homePageMain.css">
    <link rel="stylesheet" href="/css/HomePageStyles/sidebar.css">
    <link rel="stylesheet" href="/css/MyAccountPageStyles/myAccount.css">
    <link rel="stylesheet" href="/css/MyAccountPageStyles/light-Mode.css">
    <script>
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "light") {
            document.documentElement.dataset.theme = "light";
        }
    </script>
    <title>Task Nexus - Minha conta</title>
</head>

<body>

    <div id="sidebar-container"></div>

    <main class="container page-transition">
        <header class="infos">
            <div class="user-identity">
                <h2 id="display-name">Carregando...</h2>
                <h3 id="user-meta">Carregando...</h3>
            </div>
            <p id="task-count"></p>
        </header>

        <form class="alter-infos">

            <div class="fields-grid">

                <div class="field">
                    <input type="text" id="new-username" placeholder=" ">
                    <label for="new-username">Alterar nome de usuário</label>
                </div>

                <div class="field">
                    <input type="text" id="new-display-name" placeholder=" ">
                    <label for="new-display-name">Nome de exibição</label>
                </div>

                <div class="field field-password">
                    <a href="ForgotPassword.html" data-nav="ForgotPassword.html" class="reset-password-link">Redefinir senha</a>
                </div>

                <div class="field">
                    <input type="email" id="new-email" placeholder=" ">
                    <label for="new-email">Alterar email</label>
                </div>

            </div>

            <div id="account-buttons">
                <button id="save-infos" type="button">Salvar</button>
                <button id="delete-account" type="button">Deletar minha conta</button>
            </div>

        </form>

        <div id="toast" class="toast"></div>

        <div id="confirm-delete-account-modal" class="modal hidden">
            <div class="modal-content confirm-modal-content">
                <h3>Deletar conta</h3>
                <p>Tem certeza que deseja deletar sua conta? Essa ação não pode ser desfeita.</p>

                <div class="modal-actions">
                    <button type="button" id="confirm-delete-account-cancel" class="btn-cancel">Cancelar</button>
                    <button type="button" id="confirm-delete-account-ok" class="btn-delete">Deletar</button>
                </div>
            </div>
        </div>

    </main>

    <script src="/js/utils/components.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/myAccount.js"></script>
    <script src="/js/utils/transition.js"></script>

</body>
</html>
