<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNexus - Redefinir senha</title>
    <link rel="stylesheet" href="/css/loginScreen.css">
    <link rel="stylesheet" href="/css/ForgotPasswordStyles/forgotPassword.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container page-transition">

        <header class="header-logo">
            <h1 class="title">TaskNexus</h1>
        </header>

        <form class="form-login">

            <div class="request-email">
                <input type="email" placeholder="Email" class="user-field">
            </div>

            <button class="login-button active" type="submit">ENVIAR</button>
            
            <div id="status-message">

            </div>

            <a href="../InitialScreen.html" class="back-to-login" data-nav="../InitialScreen.html">Voltar</a>

        </form>

    </main>
    
    <script src="/js/utils/transition.js"></script>
    <script src="/js/forgotPassword.js"></script>
    
</body>
</html>
