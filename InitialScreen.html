<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNexus</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">

        <header>
            <h1 class="title">TaskNexus</h1>
        </header>

        <form class="form-login" action="">

            <div class="login-fields">
                <input type="text" placeholder="Nome de usuário ou email" class="user-field">
                <input type="password" placeholder="Senha" class="password-field">
            </div>

            <div class="register-recuperation">

                <div class="links-account">

                    <a href="#">Esqueci minha senha</a>
                    <a href="#">Criar conta</a>
                </div>

                <button class="login-button">ENTRAR</button>
            </div>

        </form>

    </main>

</body>
</html>
